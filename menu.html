  <style>
    /* ── Brand variable ───────────────────────────────────────── */
    :root { --brand: #8B0000; }

    /* ── Hide scrollbar on category tabs ─────────────────────── */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Animations ───────────────────────────────────────────── */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes cartPop {
      0%,100% { transform: scale(1); }
      40%     { transform: scale(1.18); }
      70%     { transform: scale(0.95); }
    }

    .slide-up  { animation: slideUp 0.38s cubic-bezier(.32,.72,0,1) both; }
    .fade-in   { animation: fadeIn  0.2s ease both; }
    .cart-pop  { animation: cartPop 0.45s ease both; }

    /* ── Tab pill active state ────────────────────────────────── */
    .tab-pill {
      transition: background .2s, color .2s, border-color .2s;
    }
    .tab-pill.active {
      background-color: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    /* ── Item card image ──────────────────────────────────────── */
    .item-thumb {
      width: 100%;
      height: 7rem;          /* 112 px */
      object-fit: cover;
    }

    /* ── Unavailable overlay ──────────────────────────────────── */
    .item-unavailable { opacity: .45; pointer-events: none; }

    /* ── Two-line clamp ───────────────────────────────────────── */
    .clamp2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Custom accent color for radio / checkbox ─────────────── */
    input[type="radio"],
    input[type="checkbox"] { accent-color: var(--brand); }

    /* ── Modal backdrop blur ──────────────────────────────────── */
    .backdrop { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  </style>
</head>

/* ================================================================
   APP STATE
================================================================ */
let lang        = "ar"        // "ar" | "en"
let tableNo     = null        // from ?table= URL param
let cart        = []          // array of cart line objects
let activeItem  = null        // item being viewed in modal
let modalQty    = 1           // qty in modal
let modalCustom = {}          // { custId: [ selectedOptionIdx, … ] }

/* shorthand */
const s = k => STR[lang][k]

/* ================================================================
   INIT
================================================================ */
function init () {
  const params = new URLSearchParams(location.search)
  tableNo = params.get("table")

  if (tableNo) {
    document.getElementById("table-badge").classList.replace("hidden","flex")
    document.getElementById("table-number").textContent = tableNo
  }

  document.getElementById("header-wa").href = `https://wa.me/${WHATSAPP_NUMBER}`

  renderTabs()
  renderMenu()
  setupScrollSpy()
}

/* ================================================================
   RENDER – CATEGORY TABS
================================================================ */
function renderTabs () {
  const nav = document.getElementById("category-tabs")
  nav.innerHTML = CATEGORIES
    .slice()
    .sort((a,b) => a.sort_order - b.sort_order)
    .map((cat, i) => `
      <button
        id="tab-${cat.id}"
        class="tab-pill flex-shrink-0 px-4 py-1.5 rounded-full
               border-2 border-gray-200 text-sm font-semibold
               text-gray-600 bg-white ${i === 0 ? "active" : ""}"
        onclick="scrollToSection(${cat.id})"
      >${lang === "ar" ? cat.name_ar : cat.name_en}</button>
    `).join("")
}

/* ================================================================
   RENDER – FULL MENU (category headings + 2-col grids)
================================================================ */
function renderMenu () {
  const main = document.getElementById("menu-content")
  main.innerHTML = CATEGORIES
    .slice()
    .sort((a,b) => a.sort_order - b.sort_order)
    .map(cat => {
      const catItems = ITEMS
        .filter(it => it.category_id === cat.id)
        .sort((a,b) => a.sort_order - b.sort_order)

      const catName = lang === "ar" ? cat.name_ar : cat.name_en
      const catDesc = lang === "ar" ? cat.desc_ar  : cat.desc_en

      return `
        <section id="section-${cat.id}" class="mb-8 scroll-mt-14">
          <h2 class="text-xl font-bold text-gray-900 mb-0.5">${catName}</h2>
          ${catDesc ? `<p class="text-sm text-gray-400 mb-3">${catDesc}</p>` : ""}
          <div class="grid grid-cols-2 gap-3">
            ${catItems.map(renderItemCard).join("")}
          </div>
        </section>
      `
    }).join("")
}

/* ================================================================
   RENDER – SINGLE ITEM CARD
================================================================ */
function renderItemCard (item) {
  const name  = lang === "ar" ? item.name_ar : item.name_en
  const desc  = lang === "ar" ? item.desc_ar  : item.desc_en
  const img   = item.image_url || `https://picsum.photos/400/300?random=${item.id}`

  const allergenBadges = (item.allergens || []).map(key => {
    const a = ALLERGENS[key]
    if (!a) return ""
    return `<span class="text-xs bg-orange-50 text-orange-700
                         border border-orange-200 px-1.5 py-0.5 rounded-full">
              ${a.emoji} ${lang === "ar" ? a.ar : a.en}
            </span>`
  }).join("")

  const unavailableOverlay = !item.available ? `
    <div class="absolute inset-0 bg-black/25 flex items-center justify-center rounded-t-2xl">
      <span class="text-white text-xs font-bold bg-black/50 px-2 py-1 rounded-full">
        ${s("unavailable")}
      </span>
    </div>` : ""

  return `
    <div
      class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100
             cursor-pointer active:scale-95 transition-transform
             ${!item.available ? "item-unavailable" : ""}"
      onclick="${item.available ? `openItemModal(${item.id})` : ""}"
    >
      <!-- Thumbnail -->
      <div class="relative">
        <img
          src="${img}"
          alt="${name}"
          class="item-thumb"
          onerror="this.src='https://picsum.photos/400/300?random=${item.id + 9}'"
        />
        ${unavailableOverlay}
      </div>

      <!-- Card body -->
      <div class="p-2.5">
        <h3 class="font-bold text-gray-800 text-sm leading-snug clamp2">${name}</h3>
        <p  class="text-gray-400 text-xs mt-0.5 clamp2">${desc || ""}</p>
        ${allergenBadges
          ? `<div class="flex flex-wrap gap-1 mt-1.5">${allergenBadges}</div>`
          : ""}
        <p class="font-bold text-sm mt-2" style="color:var(--brand)">
          ${item.price} ${s("sarSuffix")}
        </p>
      </div>
    </div>
  `
}

/* ================================================================
   SCROLL SPY  (highlights the active tab as user scrolls)
================================================================ */
function setupScrollSpy () {
  const sections = document.querySelectorAll("[id^='section-']")
  const navH     = document.getElementById("category-nav").offsetHeight

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const catId = e.target.id.replace("section-","")
        highlightTab(Number(catId))
      }
    })
  }, { rootMargin: `-${navH + 8}px 0px -60% 0px`, threshold: 0 })

  sections.forEach(sec => obs.observe(sec))
}

function scrollToSection (catId) {
  const sec  = document.getElementById(`section-${catId}`)
  const navH = document.getElementById("category-nav").offsetHeight
  if (!sec) return
  const top = sec.getBoundingClientRect().top + scrollY - navH - 8
  window.scrollTo({ top, behavior: "smooth" })
}

function highlightTab (catId) {
  document.querySelectorAll(".tab-pill").forEach(btn => {
    const isActive = btn.id === `tab-${catId}`
    btn.classList.toggle("active", isActive)
    if (isActive) {
      btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" })
    }
  })
}

/* ================================================================
   ITEM MODAL  – open
================================================================ */
function openItemModal (itemId) {
  activeItem  = ITEMS.find(it => it.id === itemId)
  if (!activeItem) return

  modalQty    = 1
  modalCustom = {}

  const name = lang === "ar" ? activeItem.name_ar : activeItem.name_en
  const desc = lang === "ar" ? activeItem.desc_ar  : activeItem.desc_en
  const img  = activeItem.image_url || `https://picsum.photos/600/400?random=${itemId}`

  document.getElementById("modal-img").src         = img
  document.getElementById("modal-img").alt         = name
  document.getElementById("modal-name").textContent = name
  document.getElementById("modal-desc").textContent = desc || ""
  document.getElementById("modal-base-price").textContent =
    `${activeItem.price} ${s("sarSuffix")}`
  document.getElementById("modal-qty").textContent = "1"

  /* allergens */
  document.getElementById("modal-allergens").innerHTML =
    (activeItem.allergens || []).map(key => {
      const a = ALLERGENS[key]
      if (!a) return ""
      return `<span class="text-xs bg-orange-50 text-orange-700
                           border border-orange-200 px-2 py-0.5 rounded-full">
                ${a.emoji} ${lang === "ar" ? a.ar : a.en}
              </span>`
    }).join("")

  /* customisations */
  renderModalCustomizations(itemId)

  /* update price badge */
  updateModalPrice()

  /* show + animate */
  const modal = document.getElementById("item-modal")
  modal.classList.remove("hidden")
  document.body.style.overflow = "hidden"

  const sheet = document.getElementById("item-modal-sheet")
  sheet.classList.remove("slide-up")
  void sheet.offsetWidth          // force reflow
  sheet.classList.add("slide-up")
}

/* ================================================================
   ITEM MODAL  – customizations
================================================================ */
function renderModalCustomizations (itemId) {
  const container = document.getElementById("modal-customizations")
  const groups    = CUSTOMIZATIONS.filter(c => c.item_id === itemId)

  container.innerHTML = groups.map(group => {
    const gName = lang === "ar" ? group.name_ar : group.name_en

    const optionsHtml = group.options.map((opt, idx) => {
      const optName  = lang === "ar" ? opt.name_ar : opt.name_en
      const priceTag = opt.price > 0
        ? `<span class="text-xs font-semibold ms-auto" style="color:var(--brand)">
             +${opt.price} ${s("sarSuffix")}
           </span>`
        : ""

      /* pre-select first option of every radio group */
      const checked = (group.type === "radio" && idx === 0) ? "checked" : ""
      if (group.type === "radio" && idx === 0) {
        if (!modalCustom[group.id]) modalCustom[group.id] = []
        modalCustom[group.id] = [{ idx, opt }]
      }

      return `
        <label
          class="flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer
                 transition-colors hover:bg-gray-50"
          style="border-color: ${(group.type === "radio" && idx === 0) ? BRAND_COLOR : "#e5e7eb"}"
          id="opt-label-${group.id}-${idx}"
        >
          <input
            type="${group.type}"
            name="cust-${group.id}"
            value="${idx}"
            ${checked}
            onchange="onCustomChange(${group.id}, ${idx}, this)"
            data-price="${opt.price}"
            class="w-4 h-4 flex-shrink-0"
          />
          <span class="text-sm text-gray-700 flex-1">${optName}</span>
          ${priceTag}
        </label>
      `
    }).join("")

    return `
      <div class="border-t border-gray-100 pt-4">
        <h4 class="text-sm font-bold text-gray-700 mb-3">${gName}</h4>
        <div class="space-y-2" id="cust-group-${group.id}">
          ${optionsHtml}
        </div>
      </div>
    `
  }).join("")
}

function onCustomChange (groupId, optIdx, input) {
  const group = CUSTOMIZATIONS.find(c => c.id === groupId)
  if (!group) return

  /* update visual border */
  document.querySelectorAll(`#cust-group-${groupId} label`).forEach(lbl => {
    lbl.style.borderColor = "#e5e7eb"
  })

  if (group.type === "radio") {
    /* single selection */
    modalCustom[groupId] = [{ idx: optIdx, opt: group.options[optIdx] }]
    const lbl = document.getElementById(`opt-label-${groupId}-${optIdx}`)
    if (lbl) lbl.style.borderColor = BRAND_COLOR
  } else {
    /* multi-selection */
    if (!modalCustom[groupId]) modalCustom[groupId] = []
    if (input.checked) {
      modalCustom[groupId].push({ idx: optIdx, opt: group.options[optIdx] })
      const lbl = document.getElementById(`opt-label-${groupId}-${optIdx}`)
      if (lbl) lbl.style.borderColor = BRAND_COLOR
    } else {
      modalCustom[groupId] = modalCustom[groupId].filter(x => x.idx !== optIdx)
    }
    /* re-colour checked items */
    modalCustom[groupId].forEach(x => {
      const lbl = document.getElementById(`opt-label-${groupId}-${x.idx}`)
      if (lbl) lbl.style.borderColor = BRAND_COLOR
    })
  }
  updateModalPrice()
}

/* ================================================================
   ITEM MODAL  – qty & price badge
================================================================ */
function changeQty (delta) {
  modalQty = Math.max(1, modalQty + delta)
  document.getElementById("modal-qty").textContent = modalQty
  updateModalPrice()
}

function updateModalPrice () {
  let unit = parseFloat(activeItem.price)
  Object.values(modalCustom).forEach(sel =>
    sel.forEach(({ opt }) => { unit += parseFloat(opt.price || 0) })
  )
  const total = (unit * modalQty).toFixed(2)
  document.getElementById("add-btn-label").textContent = s("addToCart")
  document.getElementById("add-btn-price").textContent =
    `${total} ${s("sarSuffix")}`
}

/* ================================================================
   ITEM MODAL  – close
================================================================ */
function closeItemModal () {
  document.getElementById("item-modal").classList.add("hidden")
  document.body.style.overflow = ""
}

/* ================================================================
   CART  – add item
================================================================ */
function addToCart () {
  if (!activeItem) return

  /* build extras list */
  const extras = []
  Object.values(modalCustom).forEach(sel =>
    sel.forEach(({ opt }) => {
      extras.push({
        name : lang === "ar" ? opt.name_ar : opt.name_en,
        price: parseFloat(opt.price || 0),
      })
    })
  )

  let unitPrice = parseFloat(activeItem.price)
  extras.forEach(e => { unitPrice += e.price })

  const name = lang === "ar" ? activeItem.name_ar : activeItem.name_en

  /* merge with existing identical line if possible */
  const extrasKey = JSON.stringify(extras)
  const existing  = cart.find(
    l => l.itemId === activeItem.id && l.extrasKey === extrasKey
  )

  if (existing) {
    existing.qty += modalQty
  } else {
    cart.push({
      lineId   : Date.now(),
      itemId   : activeItem.id,
      name,
      unitPrice,
      qty      : modalQty,
      extras,
      extrasKey,
    })
  }

  closeItemModal()
  refreshCartBar()
  popCartBar()
  showToast(lang === "ar" ? `✓ تمت إضافة ${name}` : `✓ Added ${name}`)
}

/* ================================================================
   CART  – bar
================================================================ */
function refreshCartBar () {
  const totalQty   = cart.reduce((s, l) => s + l.qty, 0)
  const totalPrice = cart.reduce((s, l) => s + l.qty * l.unitPrice, 0)

  const bar = document.getElementById("cart-bar")
  if (totalQty === 0) { bar.classList.add("hidden"); return }
  bar.classList.remove("hidden")

  const label = totalQty === 1 ? s("itemSingular") : s("itemPlural")
  document.getElementById("cart-bar-count").textContent =
    `${totalQty} ${label}`
  document.getElementById("cart-bar-total").textContent =
    `${totalPrice.toFixed(2)} ${s("sarSuffix")}`
}

function popCartBar () {
  const btn = document.getElementById("cart-bar-btn")
  btn.classList.remove("cart-pop")
  void btn.offsetWidth
  btn.classList.add("cart-pop")
  btn.addEventListener("animationend", () => btn.classList.remove("cart-pop"), { once: true })
}

/* ================================================================
   CART  – sheet
================================================================ */
function openCart () {
  if (cart.length === 0) return
  renderCartSheet()

  const sheet = document.getElementById("cart-sheet")
  sheet.classList.remove("hidden")
  document.body.style.overflow = "hidden"

  const panel = document.getElementById("cart-sheet-panel")
  panel.classList.remove("slide-up")
  void panel.offsetWidth
  panel.classList.add("slide-up")
}

function closeCart () {
  document.getElementById("cart-sheet").classList.add("hidden")
  document.body.style.overflow = ""
}

function renderCartSheet () {
  document.getElementById("cart-title").textContent   = s("cartTitle")
  document.getElementById("subtotal-label").textContent = s("subtotal")
  document.getElementById("wa-btn-label").textContent = s("waBtn")

  const total = cart.reduce((sum, l) => sum + l.qty * l.unitPrice, 0)
  document.getElementById("cart-subtotal").textContent =
    `${total.toFixed(2)} ${s("sarSuffix")}`

  document.getElementById("cart-items").innerHTML = cart.map(line => `
    <div class="flex gap-3 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex-1 min-w-0">
        <!-- name + remove -->
        <div class="flex items-start justify-between gap-2">
          <span class="font-semibold text-gray-800 text-sm leading-snug">${line.name}</span>
          <button
            onclick="removeCartLine(${line.lineId})"
            class="text-gray-300 hover:text-red-500 flex-shrink-0 transition-colors"
            aria-label="Remove"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <!-- extras -->
        ${line.extras.length
          ? `<p class="text-xs text-gray-400 mt-0.5">
               ${line.extras.map(e => e.name).join(" · ")}
             </p>`
          : ""}
        <!-- qty controls + line total -->
        <div class="flex items-center justify-between mt-2">
          <div class="flex items-center gap-2">
            <button
              onclick="adjustQty(${line.lineId}, -1)"
              class="w-7 h-7 rounded-full border-2 flex items-center justify-center
                     text-sm font-bold text-gray-600 active:scale-90 transition-transform"
              style="border-color:var(--brand)"
            >−</button>
            <span class="text-sm font-bold w-5 text-center tabular-nums">${line.qty}</span>
            <button
              onclick="adjustQty(${line.lineId}, 1)"
              class="w-7 h-7 rounded-full flex items-center justify-center
                     text-sm font-bold text-white active:scale-90 transition-transform"
              style="background:var(--brand)"
            >+</button>
          </div>
          <span class="font-bold text-sm tabular-nums" style="color:var(--brand)">
            ${(line.qty * line.unitPrice).toFixed(2)} ${s("sarSuffix")}
          </span>
        </div>
      </div>
    </div>
  `).join("")
}

function removeCartLine (lineId) {
  cart = cart.filter(l => l.lineId !== lineId)
  refreshCartBar()
  if (cart.length === 0) { closeCart(); return }
  renderCartSheet()
}

function adjustQty (lineId, delta) {
  const line = cart.find(l => l.lineId === lineId)
  if (!line) return
  line.qty = Math.max(1, line.qty + delta)
  refreshCartBar()
  renderCartSheet()
}

/* ================================================================
   WHATSAPP CHECKOUT
================================================================ */
function sendWhatsApp () {
  let msg = `${s("waTableLine")} ${tableNo || "-"}\n\n`

  cart.forEach(line => {
    msg += `• ${line.name}`
    if (line.extras.length) {
      msg += ` (${line.extras.map(e => e.name).join(", ")})`
    }
    msg += ` × ${line.qty} — ${(line.qty * line.unitPrice).toFixed(2)} ${s("sarSuffix")}\n`
  })

  const total = cart.reduce((sum, l) => sum + l.qty * l.unitPrice, 0)
  msg += `\n${s("waTotalLine")}: ${total.toFixed(2)} ${s("sarSuffix")}`

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank")
}

/* ================================================================
   LANGUAGE TOGGLE
================================================================ */
function toggleLang () {
  lang = lang === "ar" ? "en" : "ar"

  /* swap document direction */
  document.documentElement.lang = lang
  document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr"

  /* update toggle button label */
  document.getElementById("lang-btn").textContent = s("langSwitch")

  /* update table label */
  document.getElementById("table-label").textContent = s("tableLabel")

  /* re-render everything */
  renderTabs()
  renderMenu()
  refreshCartBar()

  /* re-attach scroll spy after new DOM */
  setTimeout(setupScrollSpy, 100)
}

/* ================================================================
   TOAST
================================================================ */
let _toastTimer
function showToast (msg) {
  const el = document.getElementById("toast")
  el.textContent = msg
  el.classList.remove("hidden")
  el.classList.add("fade-in")
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => el.classList.add("hidden"), 2600)
}

/* ================================================================
   BOOT
================================================================ */
document.addEventListener("DOMContentLoaded", init)
</script>
</body>
</html>
